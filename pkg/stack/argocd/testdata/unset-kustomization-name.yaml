apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    path: r/dbn
    repoURL: https://github.com/example/manifests.git
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  dependencies:
  - db
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    path: r/webn
    repoURL: https://github.com/example/manifests.git
