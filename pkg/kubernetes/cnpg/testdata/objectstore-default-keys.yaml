apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backup-store
  namespace: databases
spec:
  configuration:
    destinationPath: s3://bucket/pg/
    s3Credentials:
      accessKeyId:
        key: ACCESS_KEY_ID
        name: backup-creds
      secretAccessKey:
        key: SECRET_ACCESS_KEY
        name: backup-creds
  instanceSidecarConfiguration:
    resources: {}
