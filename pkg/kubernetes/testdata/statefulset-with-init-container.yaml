apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-app
  namespace: default
spec:
  selector: null
  serviceName: ""
  template:
    metadata: {}
    spec:
      containers:
        - image: myapp:latest
          name: app
          resources: {}
      initContainers:
        - args:
            - cp /src/config.yaml /data/config.yaml
          command:
            - /bin/sh
            - -c
          env:
            - name: INIT_MODE
              value: copy
          image: busybox:1.36
          name: init-data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /data
              name: data-vol
      volumes:
        - emptyDir: {}
          name: data-vol
  updateStrategy: {}
