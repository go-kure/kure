apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-tls
  namespace: default
spec:
  dnsNames:
    - api.example.com
    - www.example.com
  duration: 2160h0m0s
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  renewBefore: 360h0m0s
  secretName: api-tls-secret
