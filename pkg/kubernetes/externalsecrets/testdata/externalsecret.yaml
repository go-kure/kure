apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: default
spec:
  data:
    - remoteRef:
        key: secret/data/db
        property: password
      secretKey: password
    - remoteRef:
        key: secret/data/db
        property: username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target: {}
