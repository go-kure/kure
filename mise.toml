[tools]
# Use exact versions for reproducibility across environments
go = "1.26.6"
golangci-lint = "2.13.2"
git-cliff = "2.13.1"
hugo = "0.165.0"
# Required by scripts/sync-versions.sh and its versions:test guard harness,
# both now on `mise run verify`'s dependency graph -- a clean mise-managed
# checkout with no system yq once failed `mise run verify` with no
# explanation, which is why this entry exists at all (not just for CI).
#
# CI reads this value directly from mise.toml at run time (ci.yml's and
# deploy-docs.yml's "Read yq version from mise.toml" steps) -- bumping this
# pin alone is sufficient, no other file needs a manual update.
yq = "4.53.6"

# CI reads this value directly from mise.toml at run time too (same
# mechanism as yq above, ci.yml's "Read lychee version from mise.toml" step).
lychee = "0.24.2"

[env]
GOBIN = "{{config_root}}/.bin"
PATH = "{{config_root}}/.bin:{{env.PATH}}"

[tasks.test]
description = "Run all tests"
run = "make test"

[tasks.lint]
description = "Run linter"
run = "make lint"

[tasks.tidy]
description = "Tidy go modules"
run = "make tidy"

[tasks.check]
description = "Quick pre-commit check"
run = "make check"

[tasks.verify]
description = "Run all checks (tidy, lint, test, tool pins, govulncheck docs)"
depends = ["tidy", "lint", "test", "check-tool-versions", "check-govulncheck-docs", "versions:test"]

[tasks.check-tool-versions]
description = "Verify golangci-lint pin parity (Makefile/ci.yml/docs) against mise.toml"
run = "sh scripts/check-tool-versions.sh"

[tasks.sync-tool-versions]
description = "Sync golangci-lint pins (Makefile/ci.yml/docs) from mise.toml"
run = "sh scripts/sync-tool-versions.sh"

[tasks.check-govulncheck-docs]
description = "Verify govulncheck version parity (docs/github-workflows.md) against ci.yml"
run = "sh scripts/check-govulncheck-docs.sh"

[tasks.sync-govulncheck-docs]
description = "Sync govulncheck doc mentions (docs/github-workflows.md) from ci.yml"
run = "sh scripts/sync-govulncheck-docs.sh"

[tasks.changelog]
description = "Generate changelog from git history"
run = "git cliff -o CHANGELOG.md"

[tasks.changelog-preview]
description = "Preview changelog changes"
run = "git cliff --unreleased"

[tasks.release]
description = "Release workflow (dry-run by default, --do-it to trigger CI)"
run = "./scripts/release-trigger.sh"
raw = true

[tasks."versions:check"]
description = "Validate version consistency across all files"
run = "./scripts/sync-versions.sh check"

[tasks."versions:generate"]
description = "Generate docs and the pkg/versions Go API from versions.yaml"
run = "./scripts/sync-versions.sh generate"

[tasks."versions:test"]
description = "Run scripts/sync-versions.sh guard tests (hermetic, no network)"
run = "bash scripts/test/run-tests.sh"

[tasks."site:dev"]
description = "Start local docs dev server"
dir = "site"
run = """
bash scripts/inject-frontmatter.sh
hugo server --buildDrafts --navigateToChanged
"""

[tasks."site:build"]
description = "Build the docs site (includes CLI reference generation)"
run = "bash site/scripts/build.sh"

[tasks."site:check"]
description = "Validate code↔docs mapping against docs-map.yaml"
# Canonical script lives in go-kure/.github; kure no longer vendors a copy. Reads it
# out of the sibling checkout's origin/main — in the standard workspace every repo
# sits under a common parent, with go-kure/.github cloned as ../dot-github (the leading dot
# would collide as a directory name otherwise). That checkout may be parked on any
# branch, hence the fetch+archive instead of a bare path into its working tree.
run = """
git -C ../dot-github fetch -q origin main
d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
git -C ../dot-github archive origin/main scripts | tar -x -C "$d"
bash "$d/scripts/check-doc-sync.sh" .
"""

[tasks."site:gen"]
description = "Regenerate doc tables from docs-map.yaml"
run = "bash site/scripts/gen-docs-tables.sh"

[tasks."site:clean"]
description = "Remove generated site artifacts"
run = "rm -rf site/.generated site/public site/resources"
