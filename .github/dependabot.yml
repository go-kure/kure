# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"

    # Separate groups for different coordination needs
    groups:
      # Safe updates — no coordination needed
      go-safe:
        patterns:
          - "github.com/spf13/*"
          - "github.com/stretchr/*"
          - "gopkg.in/*"
          - "github.com/pmezard/*"
          - "github.com/blang/*"
        update-types:
          - "minor"
          - "patch"

      # Kubernetes ecosystem - only patch updates
      k8s-ecosystem:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types:
          - "patch"

      # CloudNativePG — the operator, machinery, barman-cloud and the
      # plugin move together upstream. Minor is included because no ignore:
      # entry below blocks CNPG minors, unlike the k8s and fluxcd groups.
      cnpg-ecosystem:
        patterns:
          - "github.com/cloudnative-pg/*"
        update-types:
          - "minor"
          - "patch"

      # FluxCD ecosystem — the controller API modules are released together and
      # kure imports them as one surface, so they must be reviewed and bumped as
      # one unit. Ungrouped, a single upstream release arrives as five separate
      # PRs whose go.mod changes conflict with each other in the merge queue.
      # Minor/major are ignored below, so this group only ever carries patches.
      fluxcd-ecosystem:
        patterns:
          - "github.com/fluxcd/*"
          - "github.com/controlplaneio-fluxcd/*"
        update-types:
          - "patch"

    ignore:
      # FluxCD ecosystem — cap at current series
      - dependency-name: "github.com/fluxcd/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/controlplaneio-fluxcd/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # cert-manager — allow minor and patch, block major
      - dependency-name: "github.com/cert-manager/cert-manager"
        update-types: ["version-update:semver-major"]

      # MetalLB — allow patch updates
      - dependency-name: "go.universe.tf/metallb"
        update-types: ["version-update:semver-major"]

    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github_actions"
      - "type/ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Group all GitHub Actions updates
      actions:
        patterns:
          - "*"
