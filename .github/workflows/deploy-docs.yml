name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'pkg/**/*.md'
      - 'examples/**/*.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'DEVELOPMENT.md'
      - 'scripts/gen-versions-toml.sh'
  workflow_dispatch:
    inputs:
      version_slot:
        description: 'Target subdirectory (e.g., dev, v0.1)'
        required: true
        type: string
      version_label:
        description: 'Version label for Hugo params (e.g., v0.1.0, dev)'
        required: true
        type: string
      set_latest:
        description: 'Also deploy to root / as the latest stable'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One deploy per version slot at a time
concurrency:
  group: deploy-docs-${{ inputs.version_slot || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: autops-kube-kure
    timeout-minutes: 10

    steps:
    - name: Checkout kure repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make

    - name: Read Hugo version from mise.toml
      id: hugo-version
      run: |
        HUGO_VER=$(grep '^hugo = ' mise.toml | sed 's/hugo = "\(.*\)"/\1/')
        [[ -z "$HUGO_VER" ]] && echo "::error::Failed to read Hugo version from mise.toml" && exit 1
        echo "version=$HUGO_VER" >> $GITHUB_OUTPUT

    - name: Determine version parameters
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "slot=${{ inputs.version_slot }}" >> $GITHUB_OUTPUT
          echo "label=${{ inputs.version_label }}" >> $GITHUB_OUTPUT
          echo "set_latest=${{ inputs.set_latest }}" >> $GITHUB_OUTPUT
        else
          # Push to main → dev build
          echo "slot=dev" >> $GITHUB_OUTPUT
          echo "label=dev" >> $GITHUB_OUTPUT
          echo "set_latest=false" >> $GITHUB_OUTPUT
        fi

    - name: Install Hugo CLI
      run: |
        curl -fsSL -o ${{ runner.temp }}/hugo.deb \
          https://github.com/gohugoio/hugo/releases/download/v${{ steps.hugo-version.outputs.version }}/hugo_extended_${{ steps.hugo-version.outputs.version }}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true

    - name: Read yq version from mise.toml
      id: yq-version
      run: |
        YQ_VER=$(grep '^yq = ' mise.toml | sed 's/yq = "\(.*\)"/\1/')
        [[ -z "$YQ_VER" ]] && echo "::error::Failed to read yq version from mise.toml" && exit 1
        echo "version=$YQ_VER" >> $GITHUB_OUTPUT

    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-${{ steps.yq-version.outputs.version }}-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v${{ steps.yq-version.outputs.version }}/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Validate docs map (code↔docs sync)
      uses: go-kure/.github/.github/actions/check-doc-sync@9a5c7fa664d1bb87832c7f808b0cdae59c4b1daf # main

    - name: Inject front matter
      run: bash site/scripts/inject-frontmatter.sh

    - name: Generate versions config overlay
      run: bash scripts/gen-versions-toml.sh --version "${{ steps.version.outputs.label }}"

    - name: Build Hugo site (versioned slot)
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: |
        SLOT="${{ steps.version.outputs.slot }}"
        hugo --config hugo.toml,versions.toml --minify --baseURL "https://www.gokure.dev/kure/${SLOT}/"
        # Save for deploy
        mv public public-slot

    - name: Build Hugo site (kure/ root — latest)
      if: steps.version.outputs.set_latest == 'true'
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: |
        hugo --config hugo.toml,versions.toml --minify --baseURL "https://www.gokure.dev/kure/"
        mv public public-root

    - name: Checkout go-kure.github.io
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: go-kure/go-kure.github.io
        token: ${{ secrets.DEPLOY_TOKEN }}
        path: deploy-target

    # Writes /kure/<slot>/ and, when set_latest asks for it, the /kure/ root, then
    # pushes. The root is written only if no stable tag higher than the label
    # exists when the root is written (tags fetched again), so an older release's
    # deploy that lands last cannot replace a newer release's root. When the root
    # is to be written, the label must be an existing tag whose commit is this
    # checkout's HEAD, or the step fails, so a manual dispatch with set_latest
    # runs with --ref set to that tag. A push
    # rejected because another slot's deploy landed first is written again on
    # the new tip and retried.
    - name: Deploy to go-kure.github.io
      uses: go-kure/.github/.github/actions/deploy-docs-push@9a5c7fa664d1bb87832c7f808b0cdae59c4b1daf # main
      with:
        target-path: deploy-target
        site-subdir: kure
        slot: ${{ steps.version.outputs.slot }}
        label: ${{ steps.version.outputs.label }}
        set-latest: ${{ steps.version.outputs.set_latest }}
        slot-site: site/public-slot
        root-site: site/public-root
