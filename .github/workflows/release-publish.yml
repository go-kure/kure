name: Release / Publish

on:
  push:
    tags:
      - 'v*'
  # Manual re-publish for a tag whose publish run failed before the release
  # object was created. The re-run paths do not always recover that state:
  #   * `gh run rerun --failed <id>`, and a single-job re-run, resolve the
  #     reusable workflow at the commit SHA of the FIRST attempt, so they cannot
  #     pick up a fix landed on go-kure/.github main afterwards. Measured on
  #     v0.2.0-beta.11: a --failed re-run 102s after the fix merged still ran
  #     the pre-fix command.
  #   * a full `gh run rerun <id>` does re-resolve `@main`, but only inside
  #     GitHub's 30-day re-run window, and only while a failed run still exists.
  # Moving or deleting a release tag is not an option, so dispatch is what is
  # left. Pass `--ref <tag>`: the shared workflow checks out github.ref.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

# guard-tag-ref's release probe is not atomic with the publication it guards.
# The shared publisher declares its own `concurrency: release-${{ github.ref }}`
# (go-kure/.github release-publish.yml:11-13), but that covers only the called
# workflow's jobs -- guard-tag-ref runs in this wrapper, outside it. Two
# dispatches of one tag can therefore both probe while the release is still
# absent, both see 404, and the second republish over what the first created,
# which is exactly what the guard exists to prevent.
#
# Serialising the wrapper closes that window: the second run queues before its
# guard job starts, so it probes only after the first run has finished
# publishing, sees the release, and refuses.
#
# Deliberately NOT the shared publisher's own group name. A called workflow's
# concurrency is evaluated in the caller's repository context, so reusing
# `release-${{ github.ref }}` here would risk this run holding a group that its
# own `release` job then has to wait on.
concurrency:
  group: release-publish-wrapper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A workflow_dispatch can name any ref, including a branch. Handing the
  # privileged publisher a branch would publish that tree under the release
  # path. Refuse instead of skipping: a job gated off with `if:` leaves the run
  # reading green, and an operator recovering a failed publish would take that
  # as a successful re-publish while the release object still does not exist.
  guard-tag-ref:
    name: Guard tag ref
    runs-on: autops-kube-kure
    # The workflow-level block grants the publisher contents/id-token/actions
    # write. This job only inspects the ref and the release list, so it takes
    # read access and nothing else; inheriting the publisher's write scopes
    # would put release-capable credentials on an extra job on every tag push.
    permissions:
      contents: read
    steps:
      - name: Refuse a non-tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::release-publish must run against a v* tag; got $REF"
          exit 1

      # A dispatch re-publishes a tag that already exists, and the documented
      # scope is a run that failed BEFORE goreleaser created the release
      # object. Nothing in the UI or CLI enforces that, so dispatching a tag
      # whose release is already present hands the privileged publisher a live
      # release to republish over. Refuse, and refuse equally when the answer
      # cannot be determined: a wrong "proceed" mutates a published release,
      # a wrong "refuse" costs a retry.
      #
      # The exemption is ATTEMPT 1 OF A TAG PUSH, not "a tag push". Only the
      # first attempt is a first publication, where no release can exist yet and
      # an API hiccup must not be allowed to block the normal release path.
      #
      # A re-run replays the ORIGINAL event context, so `github.event_name`
      # stays `push` on attempt 2+ -- the same frozen-context behaviour ci.yml
      # documents at :420-423 from an earlier incident, and the same reason the
      # shared publisher's workflow_dispatch exemption does not cover a re-run.
      # Without `run_attempt > 1` here, the full re-run the runbook prescribes
      # would skip this probe and hand the publisher a release an earlier
      # attempt had already created -- reaching the exact state this guard
      # exists to prevent, by the one path that was not checked.
      #
      # KNOWN LIMIT -- this guard covers a FULL re-run, never `--failed`. On
      # `gh run rerun --failed`, GitHub reschedules only jobs that concluded
      # `failure` plus their downstream jobs; `guard-tag-ref` concluded
      # `success`, so it is carried over and NONE of its steps execute, this one
      # included. `release` declares `needs: guard-tag-ref`, and a carried-over
      # `needs:` still satisfies the dependency. So a `--failed` re-run of a
      # publisher that failed AFTER creating the release object re-enters
      # publication with this probe never evaluated. The runbook does not
      # prescribe `--failed` in that state (it is an escalation), but nothing
      # here enforces that. The durable fix is a release-existence probe inside
      # the shared publisher itself, which IS rescheduled by `--failed`; it
      # belongs in `go-kure/.github`, not here.
      #
      # Measured shapes of the probe: release present -> exit 0, no stderr;
      # absent -> exit 1 with "gh: Not Found (HTTP 404)". Any other non-zero
      # exit is an undetermined answer and takes the refuse branch, so a change
      # in that error format fails safe instead of silently reading as absent.
      - name: Refuse a re-publish over a tag that already has a release
        if: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set +e
          err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1 >/dev/null)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            # This message states ONE observable fact -- the release object
            # exists -- and asserts nothing about publication. Everything it
            # could add is beyond what this step can see:
            #   * whether publication SUCCEEDED. goreleaser creates the release
            #     object before the job finishes, so a run that died part-way
            #     leaves a release here too; the runbook says as much where it
            #     rules out the asset count as a completeness oracle. Saying
            #     "publication succeeded" would send an operator hunting a
            #     failed follow-up job when the real state is an incomplete
            #     release needing escalation.
            #   * which RE-RUN MODE to use. That depends on how the failed job
            #     concluded -- `--failed` selects only `failure`, so it silently
            #     does nothing for `cancelled` or `timed_out` -- and this step
            #     cannot see that conclusion either.
            # Both belong to the runbook's decision tree, which has the run's
            # per-attempt conclusions in front of it. Route there; do not guess.
            echo "::error::$TAG already has a GitHub release, so this" \
                 "${GITHUB_EVENT_NAME} (attempt ${GITHUB_RUN_ATTEMPT}) would re-publish over a" \
                 "live release object. This does not by itself mean publication succeeded --" \
                 "a run that died part-way leaves a release object too. Determine the state and" \
                 "the recovery from the decision tree in docs/github-workflows.md before" \
                 "re-running anything."
            exit 1
          fi
          case "$err" in
            *"(HTTP 404)"*)
              echo "No release exists for $TAG; proceeding with re-publish"
              ;;
            *)
              echo "::error::could not determine whether $TAG already has a release: $err"
              exit 1
              ;;
          esac

  release:
    needs: guard-tag-ref
    uses: go-kure/.github/.github/workflows/release-publish.yml@main
    with:
      go_module: github.com/go-kure/kure
    secrets: inherit
