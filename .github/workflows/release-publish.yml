name: Release / Publish

# Keep this file name: the shared Release workflow waits for this workflow by
# it after pushing a tag.
on:
  push:
    tags:
      - 'v*'
  # Manual re-publish of a tag whose publish run failed before the release
  # object was created. `gh run rerun --failed` and single-job re-runs resolve
  # the shared publisher at the FIRST attempt's commit, so they cannot pick up
  # a fix landed on go-kure/.github main afterwards; a dispatch does. Pass
  # `--ref <tag>`: the shared workflow checks out github.ref. The recovery
  # procedure is in docs/releasing.md.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  # A workflow_dispatch can name any ref, including a branch. Handing the
  # privileged publisher a branch would publish that tree under the release
  # path. Refuse instead of skipping: a job gated off with `if:` leaves the run
  # reading green, and an operator recovering a failed publish would take that
  # as a successful re-publish while the release object still does not exist.
  #
  # The release-exists probe that used to follow here now runs inside the
  # shared publisher, as the first step of its goreleaser job, where every
  # re-run mode (`--failed` included) executes it.
  guard-tag-ref:
    name: Guard tag ref
    runs-on: autops-kube-kure
    permissions:
      contents: read
    steps:
      - name: Refuse a non-tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::release-publish must run against a v* tag; got $REF"
          exit 1

  release:
    needs: guard-tag-ref
    uses: go-kure/.github/.github/workflows/release-publish.yml@main
    with:
      go_module: github.com/go-kure/kure
    secrets: inherit
