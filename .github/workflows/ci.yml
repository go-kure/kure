name: CI

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]
    # No draft gate below (2026-08-19, GitLab mr-review parity) — every job runs
    # on a draft PR the same as a ready one, so ready_for_review buys nothing
    # here and is left out of the default set (opened, synchronize, reopened).
    # labeled/unlabeled added (2026-08-30, chatgpt-codex-connector review on
    # go-kure/kure#729): without them, adding the pin-impact job's
    # 'pin-impact-ack' override label doesn't start a new run, so the
    # required `build` check stays failed until an unrelated push — the
    # acknowledgement path existed but nothing re-evaluated it. This does
    # mean ANY label add/remove on a PR reruns the whole pipeline, not just
    # pin-impact — accepted: label changes are rare, deliberate maintainer
    # actions, not routine PR activity.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:  # required: checks must report on the merge queue's temporary branch
  schedule:
    - cron: '0 4 * * *'  # 4am UTC daily - catch external changes
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  GOLANGCI_LINT_VERSION: 'v2.13.1'
  # Several repos across both forges install this same scanner and share the
  # govulncheck-gate action, but nothing compares their pins. A bump therefore has
  # to be mirrored by hand in each workflow that installs it, this one included.
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: 'v1.7.0'
  # The runner binary patch (Runner.Worker.dll) renames all occurrences of
  # ACTIONS_RESULTS_URL to ACTIONS_RESULTS_ORL, including the name the Worker
  # injects into step process environments.  Workflow env overrides runner-injected
  # values, so setting ACTIONS_RESULTS_URL here ensures upload-artifact,
  # download-artifact, and cache (v2) all see the correct in-cluster URL.
  ACTIONS_RESULTS_URL: 'http://actions-cache-server.arc-runners.svc.cluster.local:3000/'

# Avoid duplicate runs on the same commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Pre-flight: Detect Changed Paths
  # =============================================================================

  changes:
    name: detect-changes
    runs-on: autops-kube-kure
    timeout-minutes: 2
    # On merge_group there is no PR base to diff against; dorny/paths-filter would
    # error. Skip the filter and force both outputs to 'true' so every gating job
    # runs in the queue — otherwise required checks never report and merges hang.
    outputs:
      go: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.go }}
      docs: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.docs }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      if: github.event_name != 'merge_group'
      id: filter
      with:
        filters: |
          go:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - 'Makefile'
            - '.github/workflows/**'
            # The only `sync-versions.sh check` invocation lives in the `validate`
            # job, which is gated on this filter. Without these entries a PR
            # touching only version metadata skipped the range and drift guards
            # entirely and still reported success.
            - 'versions.yaml'
            - 'docs/compatibility.md'
            - 'scripts/sync-versions.sh'
            # scripts/test/** is sync-versions.sh's own guard-test harness (run as
            # the "Run sync-versions.sh guard tests" step below). Without this
            # entry, a PR touching only a case file or the harness itself -- the
            # exact changes this harness exists to enforce CI coverage of -- would
            # skip `validate` and report success unexercised.
            - 'scripts/test/**'
            # Renovate's postUpgradeTasks command for the external-secrets pin —
            # same reasoning as the three entries above: a PR touching only this
            # script would otherwise skip `validate`/`test` entirely (the `build`
            # gate accepts `skipped` deps), so a broken release-pinning script
            # could land with a green build.
            - 'scripts/sync-eso-pin.sh'
            # check-tool-versions (golangci-lint pin parity) reads all of these;
            # a PR touching only one must not be able to skip the lint job it
            # runs in — that would leave the checker unexercised on exactly the
            # class of edit most likely to break it.
            - 'mise.toml'
            - 'scripts/check-tool-versions.sh'
            - 'scripts/sync-tool-versions.sh'
            - 'docs/github-workflows.md'
            # check-govulncheck-docs (govulncheck version parity, ci.yml vs the doc) reads
            # these two scripts plus ci.yml/docs/github-workflows.md, both already listed above.
            - 'scripts/check-govulncheck-docs.sh'
            - 'scripts/sync-govulncheck-docs.sh'
          docs:
            - 'site/**'
            - 'docs/**'
            - '**.md'
            - 'pkg/**'
            - 'scripts/**'
            - '.github/workflows/ci.yml'

  # =============================================================================
  # Stage 1: Fast Validation
  # =============================================================================

  validate:
    name: lint
    runs-on: autops-kube-kure
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    - name: Read Go version from go.mod
      id: go-version
      run: |
        GO_VER=$(grep '^go ' go.mod | awk '{print $2}')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    # Source-aware Go build cache (was go.sum-only → froze at an old snapshot). Warmed on
    # push-to-main, restored by PR + queue via fallback. Split restore/save + matched-key log;
    # distinct job prefix so lint and test don't overwrite each other's entry.
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-validate-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-validate-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-validate-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install dependencies
      run: make deps

    - name: Check Go version consistency
      run: make check-go-version

    - name: Check tool version parity
      run: make check-tool-versions

    - name: Check govulncheck docs
      run: make check-govulncheck-docs

    # Version pinned here (4.44.6) is a separate copy from mise.toml's own `yq` pin --
    # scripts/check-tool-versions.sh does not cover yq (golangci-lint only). Bumping
    # one without the other silently desyncs mise's toolchain from CI. If you bump
    # this, also update mise.toml's `yq` pin and the other 3 occurrences of this exact
    # cache-key/download-URL pair (2 more in this file, 1 in deploy-docs.yml).
    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-4.44.6-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    # sync-versions.sh check's MVS-floor guard (validate_mvs_floors) needs a populated
    # module cache to read a floor module's own go.mod -- it degrades to a warning
    # otherwise. "Install dependencies" (make deps, above) must run before this step;
    # do not reorder them.
    - name: Validate version consistency
      run: ./scripts/sync-versions.sh check

    # sync-eso-pin.sh, sync-tool-versions.sh and sync-govulncheck-docs.sh have no other CI
    # coverage: they're Renovate postUpgradeTasks commands, not something
    # `sync-versions.sh check`/`make check-tool-versions`/`make check-govulncheck-docs` ever
    # invokes or parses — a syntax error here would only surface the next time Renovate runs
    # it. Cheap floor: catch a broken script before it merges, not full shellcheck (a
    # repo-wide tooling decision, out of scope for these scripts). Dispatched per each
    # script's own shebang/renovate.json invocation, not uniformly via bash -n: renovate.json
    # runs sync-tool-versions.sh and sync-govulncheck-docs.sh with `sh` (not bash), and bash
    # accepts bashisms POSIX sh would reject, so a bash -n pass on a #!/bin/sh script doesn't
    # prove sh can actually parse it.
    - name: Syntax-check version-sync scripts
      run: |
        for f in scripts/sync-tool-versions.sh scripts/sync-govulncheck-docs.sh; do
          sh -n "$f"
        done
        for f in scripts/sync-eso-pin.sh scripts/sync-versions.sh scripts/test/run-tests.sh scripts/test/lib.sh scripts/test/cases/*.sh; do
          bash -n "$f"
        done

    # Runs the mutation matrix (scripts/test/cases/*.sh) that proves
    # sync-versions.sh's six guards actually fail when they should, not just
    # pass on the real repo -- see scripts/test/lib.sh and the fixtures/
    # under it. Hermetic and network-independent (stub go/curl/git), so
    # unlike "Validate version consistency" above it needs no populated
    # module cache from make deps -- a statement about this step's own
    # dependencies, not about step order, which still runs it after deps.
    - name: Run sync-versions.sh guard tests
      run: bash scripts/test/run-tests.sh

    - name: Cache goimports
      id: goimports-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/bin/goimports
        key: goimports-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          goimports-

    - name: Install goimports
      if: steps.goimports-cache.outputs.cache-hit != 'true'
      run: go install golang.org/x/tools/cmd/goimports@latest

    - name: Check formatting
      run: |
        make fmt
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::Code is not properly formatted. Run 'make fmt' to fix."
          git diff
          exit 1
        fi

    - name: Check go mod tidy
      run: |
        make tidy
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "::error::go.mod or go.sum is not tidy. Run 'make tidy' to fix."
          git diff go.mod go.sum
          exit 1
        fi

    - name: Run go vet
      run: make vet

    - name: Fetch base branch for diff-based lint
      if: github.event_name == 'pull_request'
      run: git fetch origin ${{ github.base_ref }} --depth=1

    - name: Run linters
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          make lint LINT_FLAGS="--new-from-rev=origin/${{ github.base_ref }}"
        else
          make lint
        fi

    - name: Save Go build cache
      # Default-branch only: a PR's own gocache entry is dead the moment it merges (GitHub
      # scopes a cache to the branch that wrote it and its descendants), so saving from
      # feature branches only inflates the shared actions-cache bucket for no restore benefit.
      # Restores still fall back to the main-branch entry via restore-keys above.
      # See ginsys/opsmaster docs/arc-runners.md "Purge / retention" (2026-08-25 growth incident).
      if: success() && steps.gocache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

  action-pins:
    name: action-pins
    runs-on: autops-kube-kure
    timeout-minutes: 2
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Check action pins
      uses: go-kure/.github/.github/actions/check-action-pins@0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5 # main

  forbidden-terms:
    name: forbidden-terms
    runs-on: autops-kube-kure
    timeout-minutes: 2
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # This job has no path or event filter: full-tree PR and merge-queue scans
    # must use identical scope.
    - name: Check for downstream references
      uses: go-kure/.github/.github/actions/check-forbidden-terms@0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5 # main

    - name: Checkout canonical guard
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: go-kure/.github
        ref: 0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5
        path: .tmp/go-kure-dot-github

    - name: Verify vendored guard matches canonical
      run: diff -u .tmp/go-kure-dot-github/scripts/check-forbidden-terms.sh site/scripts/check-forbidden-terms.sh

  pin-impact:
    name: pin-impact
    runs-on: autops-kube-kure
    timeout-minutes: 3
    # PR-only, like doc-gate: needs a base-ref diff, which merge_group events
    # don't carry the same way pull_request events do. By the time a PR
    # reaches the merge queue this job has already gated it via `build`
    # (see `build`'s needs: list below) against the same base it will
    # actually merge onto — usually no new information from a merge_group
    # re-run. The gap this doesn't cover: two PRs landing in the same queue
    # batch where one adds a go-kure/.github action reference (or a script
    # gains a new `source`) and the other bumps the pin, and neither alone
    # sees both changes — narrow, and re-running here needs deriving the
    # merge group's own base/head from `github.event.merge_group.*` rather
    # than `github.base_ref`, which this job doesn't do today. Tracked:
    # go-kure/kure#730 (chatgpt-codex-connector review on go-kure/kure#729,
    # 2026-08-30).
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Render and gate on go-kure/.github pin impact
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_REF: ${{ github.base_ref }}
        # Maintainer-controlled override, same convention as check-doc-gate's
        # docs-skip label: add 'pin-impact-ack' after reviewing a real hit to
        # merge anyway. See check-pin-impact.sh's PIN_IMPACT_ACK handling.
        PIN_IMPACT_ACK: ${{ contains(github.event.pull_request.labels.*.name, 'pin-impact-ack') }}
      run: ./scripts/check-pin-impact.sh --base-ref "origin/$BASE_REF" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Stage 2: Tests and Security (parallel with lint)
  # =============================================================================

  test:
    name: test
    runs-on: autops-kube-kure
    timeout-minutes: 20
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v gcc &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends build-essential)

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    - name: Read Go version from go.mod
      id: go-version
      run: |
        GO_VER=$(grep '^go ' go.mod | awk '{print $2}')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    # Source-aware Go build cache (see the validate job for rationale). Distinct prefix.
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-test-race-cover-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-test-race-cover-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-test-race-cover-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install dependencies
      run: make deps

    - name: Run tests
      run: |
        set -euo pipefail
        mkdir -p coverage
        go test -v -race -coverprofile=coverage/coverage.out -covermode=atomic -timeout 15m ./... 2>&1 | tee /tmp/gotest.log

    - name: Save Go build cache
      # Default-branch only: a PR's own gocache entry is dead the moment it merges (GitHub
      # scopes a cache to the branch that wrote it and its descendants), so saving from
      # feature branches only inflates the shared actions-cache bucket for no restore benefit.
      # Restores still fall back to the main-branch entry via restore-keys above.
      # See ginsys/opsmaster docs/arc-runners.md "Purge / retention" (2026-08-25 growth incident).
      if: success() && steps.gocache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

    - name: Upload test log
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      continue-on-error: true
      with:
        name: test-log
        path: /tmp/gotest.log
        if-no-files-found: warn

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage
        path: coverage/coverage.out
        if-no-files-found: error
        retention-days: 7

  security:
    name: Security
    runs-on: autops-kube-kure
    # Was 5 min, sized for -scan package (<60s). -scan symbol replaced it (see the
    # "Run govulncheck" step) and this repo has already timed out once on a full
    # symbol scan of this dependency graph (10+ min, commit 700cab3) before a
    # security-job-specific build cache existed. That cache (added in this PR)
    # should make repeat runs fast, but a cold/partial cache on a large source
    # change is the case that bit before — 15 min is headroom for that, not the
    # expected runtime.
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    # GOMEMLIMIT keeps Go's GC under the runner pod memory limit so govulncheck (peaks ~3.8Gi
    # on large module graphs) doesn't get OOMKilled. Pairs with the 6Gi ARC runner limit.
    env:
      GOMEMLIMIT: 5GiB

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: |
        command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)
        command -v jq &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends jq)

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    - name: Cache govulncheck binary
      id: govulncheck-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/bin/govulncheck
        key: govulncheck-${{ env.GOVULNCHECK_VERSION }}

    - name: Read Go version from go.mod
      id: go-version
      run: |
        GO_VER=$(grep '^go ' go.mod | awk '{print $2}')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    # Source-aware Go build cache. govulncheck's scan compiles the module, so a warm cache
    # helps here too (this job had no build cache before). Distinct prefix.
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-security-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-security-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-security-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install govulncheck
      if: steps.govulncheck-cache.outputs.cache-hit != 'true'
      run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

    - name: Run govulncheck
      run: |
        # A separate human-readable `-scan symbol ./...` run used to precede this
        # one, purely for the log. Dropped: it re-ran the exact same, potentially
        # slow scan a second time for no signal the gate step below doesn't already
        # print (every reachable and allowed OSV ID, plus a fix hint).
        #
        # In JSON mode a completed scan exits 0 whether or not it found anything
        # reachable — reachable findings alone do not produce a nonzero exit here.
        # So a nonzero exit means govulncheck itself failed (package load error,
        # vuln-db fetch failure, a Go/govulncheck version mismatch, …), and the
        # report file can still be non-empty, parseable JSON with zero findings in
        # that case — a silently "clean" result from a scan that never completed.
        # That is caught here explicitly: the gate can only tell "empty/unparseable"
        # from "well-formed", not "well-formed but cut short".
        set +e
        ~/go/bin/govulncheck -scan symbol -format json ./... > govulncheck.json 2> govulncheck.err
        scan_rc=$?
        set -e
        if [ "$scan_rc" -ne 0 ]; then
          echo "::error::govulncheck exited $scan_rc — scan did not complete"
          cat govulncheck.err
          exit 1
        fi
        if [ ! -s govulncheck.json ]; then
          echo "::error::govulncheck produced no JSON output"
          cat govulncheck.err
          exit 1
        fi

    - name: Gate on reachable vulnerabilities
      uses: go-kure/.github/.github/actions/govulncheck-gate@0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5 # main
      with:
        report: govulncheck.json
        # Accepted-risk advisories: reachable under symbol scan but not exploitable in
        # kure's use. Every entry MUST name the advisory, the reachable path, and why no
        # bump clears it. An entry with no justification is a bug, not a waiver.
        #
        # GO-2026-5377: privilege escalation in the external-secrets *controller*
        #   reconciler. kure only imports the apis module for CRD deepcopy/scheme
        #   registration; every reachable trace runs through generated
        #   DeepCopyObject/DeepCopyInto boilerplate (pkg/io/runtime.go:54) or package
        #   init (pkg/kubernetes/externalsecrets/create.go:4), never a reconciler.
        #   The fix landed upstream at v2.4.1 (github.com/external-secrets/
        #   external-secrets/releases/tag/v2.4.1) and kure now pins v2.9.0
        #   (versions.yaml upstream_release), well past it -- but the waiver stays
        #   structurally necessary, not just untagged: the Go vuln DB entry's
        #   standard `ranges` block is `{"introduced": "0"}` with no `fixed` event;
        #   the v2.4.1 fix exists only inside a `custom_ranges` annotation the DB
        #   itself flags as "could not be automatically mapped to standard Go
        #   module versions" (vuln.go.dev/ID/GO-2026-5377.json). Standard
        #   govulncheck matching consumes `ranges`, not `custom_ranges`, so it
        #   flags every version as affected regardless of the real fix commit --
        #   confirmed empirically: still reachable at the v2.9.0 pin. Same finding,
        #   same reasoning as launcher's identical allowlist entry — see
        #   launcher/docs/github-workflows.md.
        allowlist: 'GO-2026-5377'

    - name: Save Go build cache
      # Default-branch only: a PR's own gocache entry is dead the moment it merges (GitHub
      # scopes a cache to the branch that wrote it and its descendants), so saving from
      # feature branches only inflates the shared actions-cache bucket for no restore benefit.
      # Restores still fall back to the main-branch entry via restore-keys above.
      # See ginsys/opsmaster docs/arc-runners.md "Purge / retention" (2026-08-25 growth incident).
      if: success() && steps.gocache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

    - name: Check for outdated dependencies
      run: make outdated

    - name: Check for sensitive files
      run: |
        # Check for common sensitive patterns
        matches=$(grep -r -i "password\|secret\|token\|key" --include="*.go" --include="*.yaml" --include="*.yml" . | grep -v "test" | grep -v "_test.go" | grep -E "(=|:)" | head -10 || true)
        if [ -n "$matches" ]; then
          printf '%s\n' "$matches"
          echo "::warning::Potential sensitive information found in code. Please review."
        fi

  # =============================================================================
  # Stage 3: Coverage Check
  # =============================================================================

  coverage-check:
    name: Coverage Check
    runs-on: autops-kube-kure
    timeout-minutes: 5
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Download coverage artifact
      id: download-coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: coverage
        path: coverage/

    - name: Check coverage threshold
      id: coverage
      run: |
        if [ ! -f coverage/coverage.out ]; then
          echo "::error::Coverage artifact not available"
          exit 1
        fi
        if ! COVERAGE_REPORT=$(go tool cover -func=coverage/coverage.out); then
          echo "::error::Coverage profile is invalid"
          exit 1
        fi
        COVERAGE=$(printf '%s\n' "$COVERAGE_REPORT" | awk 'END { gsub(/%/, "", $3); print $3 }')
        if ! [[ "$COVERAGE" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
          echo "::error::Could not parse total coverage from coverage profile"
          exit 1
        fi
        THRESHOLD=90
        PKG_THRESHOLD=90
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Current coverage: ${COVERAGE}%"
        echo "Required threshold: ${THRESHOLD}%"

        if [ "${COVERAGE%.*}" -lt "$THRESHOLD" ]; then
          echo "::error::Test coverage ${COVERAGE}% is below required threshold of ${THRESHOLD}%"
          exit 1
        else
          echo "::notice::Test coverage ${COVERAGE}% meets required threshold"
        fi

        # Per-package coverage check — fail if any non-examples package is below PKG_THRESHOLD
        echo ""
        echo "Checking per-package coverage (threshold: ${PKG_THRESHOLD}%)..."
        awk '
        NR == 1 { next }
        {
          split($1, a, ":")
          file = a[1]
          n = split(file, parts, "/")
          pkg = ""
          for (i = 1; i < n; i++) {
            if (i > 1) pkg = pkg "/"
            pkg = pkg parts[i]
          }
          total_stmts[pkg] += $2
          if ($3 > 0) covered_stmts[pkg] += $2
        }
        END {
          for (pkg in total_stmts) {
            if (total_stmts[pkg] > 0) {
              pct = int(covered_stmts[pkg] / total_stmts[pkg] * 100)
              print pkg " " pct
            }
          }
        }
        ' coverage/coverage.out | sort > /tmp/pkg_coverage.txt

        FAILED=0
        while read pkg pct; do
          case "$pkg" in
            */examples/*) continue ;;
          esac
          if [ "$pct" -lt "$PKG_THRESHOLD" ]; then
            echo "::error::Package ${pkg} coverage ${pct}% is below per-package threshold of ${PKG_THRESHOLD}%"
            FAILED=1
          else
            echo "  ${pkg}: ${pct}%"
          fi
        done < /tmp/pkg_coverage.txt

        if [ "$FAILED" -eq 1 ]; then
          echo "::error::One or more packages are below the per-package coverage threshold of ${PKG_THRESHOLD}%"
          exit 1
        fi
        echo "All packages meet the per-package coverage threshold."

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage/coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: coverage
        message: |
          ## Test Coverage Report

          **Total Coverage:** ${{ steps.coverage.outputs.coverage }}%

          Coverage threshold: 90%

  # =============================================================================
  # Stage 4: Build Gate (parallel with coverage-check)
  # =============================================================================

  build:
    name: build
    runs-on: autops-kube-kure
    timeout-minutes: 1
    needs: [validate, test, docs-build, coverage-check, doc-gate, action-pins, forbidden-terms, security, pin-impact]
    if: always()
    steps:
    - name: Check build results
      run: |
        vl="${{ needs.validate.result }}"
        tt="${{ needs.test.result }}"
        db="${{ needs.docs-build.result }}"
        cc="${{ needs.coverage-check.result }}"
        dg="${{ needs.doc-gate.result }}"
        ap="${{ needs.action-pins.result }}"
        ft="${{ needs.forbidden-terms.result }}"
        sc="${{ needs.security.result }}"
        pi="${{ needs.pin-impact.result }}"
        if [ "$ft" != "success" ]; then
          echo "Forbidden-terms job did not succeed (result: $ft)"
          exit 1
        fi
        for result in "$vl" "$tt" "$db" "$cc" "$dg" "$ap" "$sc" "$pi"; do
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "Required job failed or was cancelled (result: $result)"
            exit 1
          fi
        done

  # =============================================================================
  # Docs Build (parallel with main pipeline)
  # =============================================================================

  docs-build:
    name: docs-build
    runs-on: autops-kube-kure
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Read Hugo version from mise.toml
      id: hugo-version
      run: |
        HUGO_VER=$(grep '^hugo = ' mise.toml | sed 's/hugo = "\(.*\)"/\1/')
        if [ -z "$HUGO_VER" ]; then
          echo "::error::Failed to parse Hugo version from mise.toml"
          exit 1
        fi
        echo "version=$HUGO_VER" >> $GITHUB_OUTPUT

    - name: Restore Hugo from cache
      id: hugo-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/hugo-bin
        key: hugo-${{ steps.hugo-version.outputs.version }}-linux-amd64

    - name: Install Hugo CLI
      if: steps.hugo-cache.outputs.cache-hit != 'true'
      run: |
        HUGO_VER="${{ steps.hugo-version.outputs.version }}"
        curl -fsSL -o ${{ runner.temp }}/hugo.deb \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VER}/hugo_extended_${HUGO_VER}_linux-amd64.deb"
        sudo dpkg -i ${{ runner.temp }}/hugo.deb
        mkdir -p ${{ runner.temp }}/hugo-bin
        cp /usr/local/bin/hugo ${{ runner.temp }}/hugo-bin/hugo

    - name: Add cached Hugo to PATH
      if: steps.hugo-cache.outputs.cache-hit == 'true'
      run: sudo install ${{ runner.temp }}/hugo-bin/hugo /usr/local/bin/hugo

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    - name: Cache Hugo modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/hugo_cache
        key: ${{ runner.os }}-hugo-${{ hashFiles('site/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-hugo-

    # Version pinned here (4.44.6) is a separate copy from mise.toml's own `yq` pin --
    # scripts/check-tool-versions.sh does not cover yq (golangci-lint only). Bumping
    # one without the other silently desyncs mise's toolchain from CI. If you bump
    # this, also update mise.toml's `yq` pin and the other 3 occurrences of this exact
    # cache-key/download-URL pair (2 more in this file, 1 in deploy-docs.yml).
    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-4.44.6-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Validate docs map (code↔docs sync)
      uses: go-kure/.github/.github/actions/check-doc-sync@0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5 # main

    - name: Inject front matter
      run: bash site/scripts/inject-frontmatter.sh

    - name: Generate versions config overlay
      run: bash scripts/gen-versions-toml.sh --version dev

    - name: Build Hugo site
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: hugo --config hugo.toml,versions.toml --minify --baseURL "https://www.gokure.dev/kure/"

    - name: Upload docs artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: docs-site
        path: site/public/
        retention-days: 7

    - name: Cache lychee
      id: lychee-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/lychee
        key: lychee-0.24.2-linux-amd64

    - name: Install lychee
      if: steps.lychee-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o /tmp/lychee.tar.gz \
          https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
        tar xzf /tmp/lychee.tar.gz -C /tmp
        install -m755 /tmp/lychee-x86_64-unknown-linux-gnu/lychee ~/bin/lychee
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add lychee to PATH
      if: steps.lychee-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Build Hugo site (root-relative, for link check)
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
      run: hugo --baseURL "/" --destination .linkcheck --quiet

    - name: Check internal links (rendered site)
      uses: go-kure/.github/.github/actions/check-links@0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5 # main
      with:
        built-dir: site/.linkcheck

  # =============================================================================
  # PR-only Jobs (parallel, non-blocking)
  # =============================================================================

  analyze-changes:
    name: Analyze Changes
    runs-on: autops-kube-kure
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          **.go
          go.mod
          go.sum
          Makefile
          .github/workflows/**.yml

    - name: Analyze Go changes
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Changed Go-related files:"
        echo "${{ steps.changed-files.outputs.all_changed_files }}"

        # Count lines of code changes
        ADDED_LINES=$(git diff --numstat origin/main...HEAD | awk '{added+=$1} END {print added+0}')
        REMOVED_LINES=$(git diff --numstat origin/main...HEAD | awk '{removed+=$2} END {print removed+0}')

        echo "Lines added: $ADDED_LINES"
        echo "Lines removed: $REMOVED_LINES"

        # Check if this is a major change
        if [ "$ADDED_LINES" -gt 500 ] || [ "$REMOVED_LINES" -gt 500 ]; then
          echo "::notice::This is a major change (500+ lines). Consider breaking it into smaller PRs."
        fi

    - name: Check for breaking changes
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # Look for potential breaking changes in public APIs
        if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -E "pkg/.*\.go$"; then
          echo "::warning::Changes detected in pkg/ directory. Review for potential breaking changes to public API."
        fi

  # Layer 3 change-gate: a mapped package's source change must touch its mapped
  # docs in the same PR. Always runs on PRs (so a pkg-only change can't skip it);
  # the maintainer-restricted `docs-skip` label bypasses via the script. On
  # merge_group this is skipped (the PR already passed it), which the build gate
  # accepts. Required via the `build` aggregate job.
  doc-gate:
    name: doc-gate
    runs-on: autops-kube-kure
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    # Version pinned here (4.44.6) is a separate copy from mise.toml's own `yq` pin --
    # scripts/check-tool-versions.sh does not cover yq (golangci-lint only). Bumping
    # one without the other silently desyncs mise's toolchain from CI. If you bump
    # this, also update mise.toml's `yq` pin and the other 3 occurrences of this exact
    # cache-key/download-URL pair (2 more in this file, 1 in deploy-docs.yml).
    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-4.44.6-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Enforce docs-with-code (Layer 3)
      uses: go-kure/.github/.github/actions/check-doc-gate@0c93c6f0126f6c38bb8eafdaf63d559dab6fa1c5 # main
      with:
        base-ref: origin/${{ github.base_ref }}
        skip: ${{ contains(github.event.pull_request.labels.*.name, 'docs-skip') }}

