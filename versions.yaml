# versions.yaml - Single source of truth for supported version metadata
#
# The exact build version of each dependency lives ONLY in go.mod (the pin).
# This file holds the human-judgment metadata that no tool can derive:
#
#   supported_range: Versions the generated YAML works with (documented + guarded)
#   notes / related_packages: context for reviewers
#
# scripts/sync-versions.sh reads the build version from go.mod and asserts its
# major.minor falls within supported_range. There is no "current" field to keep
# in sync — that removes the recurring dependency-bot lint failure (issue #593).
# Bot-side update caps live in renovate.json (repo rules on top of the shared
# go-kure/.github preset), not here; the retired max_dependabot field mirrored
# caps into .github/dependabot.yml before the Renovate migration.
#
# version_basis (optional, default "semver"):
#   Set to "kubernetes" when the go module is versioned v0.N.x but supported_range
#   is expressed in cluster terms (1.N). The guard then normalizes v0.N -> 1.N
#   before comparing. Only k8s.io/api needs this today.
#
# floor_module (optional):
#   Set when go_module's pin is not independently chosen but is instead the
#   minimum-version-selection floor set by a different module's own go.mod.
#   The guard asserts the pin equals exactly what floor_module currently
#   requires for go_module. Only barman-cloud needs this today.

# Go version (mise.toml is authoritative for tooling)
go:
  current: "1.26.6"
  # mise.toml is the source of truth for Go version
# Infrastructure dependencies
infrastructure:
  barman-cloud:
    go_module: "github.com/cloudnative-pg/barman-cloud"
    floor_module: "github.com/cloudnative-pg/plugin-barman-cloud"
    supported_range: "0.5"
    notes: |
      Barman Cloud object-store API types (BarmanObjectStoreConfiguration,
      S3Credentials) — a separate module from both the CNPG operator and the
      barman-cloud *plugin* (cnpg-barman-cloud-plugin, below). Kure imports pkg/api
      directly.
      The pin is derived from floor_module's own requirement, not chosen from
      barman-cloud's tags — a hand-picked tag would be a downgrade Go's
      minimum-version selection wouldn't let the build use. renovate.json
      disables the standalone gomod bump for it (see the rule there).
  cert-manager:
    go_module: "github.com/cert-manager/cert-manager"
    # Kure generates YAML compatible with these deployed versions
    supported_range: "1.14 - 1.21"
    notes: |
      Stable v1 APIs. v1.20 deprecated ObjectReference in favor of IssuerReference (type alias).
      v1.21 removed the deprecated ObjectReference type (#8625); kure already uses
      IssuerReference (plus LocalObjectReference/SecretKeySelector from meta/v1), so the
      imported certmanager/v1 + acme/v1 + meta/v1 surface is unaffected — build + tests pass.
  cilium:
    go_module: "github.com/cilium/cilium"
    supported_range: "1.18 - 1.20"
    notes: |
      Cilium CRDs. Every builder in pkg/kubernetes/cilium emits
      ciliumv2.SchemeGroupVersion — i.e. cilium.io/v2 — for all thirteen resources
      (CiliumNetworkPolicy, CiliumClusterwideNetworkPolicy, CiliumCIDRGroup,
      CiliumEgressGatewayPolicy, CiliumLocalRedirectPolicy, CiliumLoadBalancerIPPool,
      CiliumEnvoyConfig, CiliumClusterwideEnvoyConfig, and the five BGPv2 types).
      The floor is 1.18: BGPv2, CiliumCIDRGroup and CiliumLoadBalancerIPPool were
      served only as cilium.io/v2alpha1 up to and including 1.17 and were promoted
      to v2 in 1.18, so generated YAML does not apply to older clusters.
      v1.20 is a routine minor with no changes to the imported cilium.io/v2 spec
      types or to policy/api — build + tests pass unchanged.
    related_packages:
      - "github.com/cilium/hive"
      - "github.com/cilium/statedb"
      - "github.com/cilium/proxy"
  fluxcd:
    go_module: "github.com/fluxcd/flux2/v2"
    supported_range: "2.4 - 2.9"
    notes: |
      v1beta2 APIs removed in 2.8, DependsOn uses DependencyReference.
      image-automation-controller promoted to v1.
      v2.9 (source-controller/api v1.9): OCIRepositoryVerification and
      HelmChartVerification split into distinct types (HelmChart.Spec.Verify is now
      *HelmChartVerification); OCIRepositoryVerification gained TrustedRootSecretRef.
      notification-controller/api v1.9: Receiver.Spec.Resources is now []ReceiverResource
      (embeds CrossNamespaceObjectReference + CEL Filter) and Receiver.Spec.SecretRef is a
      pointer. Provider/Alert remain v1beta3 upstream (tracked by #250/#252).
      All github.com/fluxcd/* packages upgraded together.
    related_packages:
      - "github.com/fluxcd/*"
      - "github.com/controlplaneio-fluxcd/*"
  flux-operator:
    go_module: "github.com/controlplaneio-fluxcd/flux-operator"
    supported_range: "0.23 - 0.53"
    notes: |
      Upgraded alongside the FluxCD 2.9 ecosystem. The vendored install bundle
      (pkg/stack/fluxcd/flux_operator_install.yaml) and FluxOperatorVersion constant
      are pinned in lockstep with this module version.
  source-watcher:
    go_module: "github.com/fluxcd/source-watcher/api/v2"
    supported_range: "2.0 - 2.2"
    notes: |
      Optional FluxCD controller for source composition/decomposition.
      Manages ArtifactGenerator CRD (source.extensions.fluxcd.io/v1beta1).
      Not in default Flux installation; requires --components-extra=source-watcher.
    related_packages:
      - "github.com/fluxcd/source-controller"
  metallb:
    go_module: "go.universe.tf/metallb"
    supported_range: "0.14 - 0.16"
    notes: |
      v1beta1 APIs stable across this range. v0.16.0 is a minor release:
      BGP config-parsing refactor (selectedNodes/selectedPools rewrite),
      node-specific ConfigurationState validation, security fixes via
      govulncheck. No changes to the v1beta1 API types that kure imports
      (IPAddressPool, BGPPeer, BGPAdvertisement, L2Advertisement, BFDProfile).
  prometheus-operator:
    go_module: "github.com/prometheus-operator/prometheus-operator/pkg/apis/monitoring"
    supported_range: "0.75 - 0.93"
    notes: |
      Prometheus operator monitoring API types (ServiceMonitor, PodMonitor, PrometheusRule).
      Only the /pkg/apis/monitoring submodule is imported — not the full operator.
      Stable v1 APIs (monitoring.coreos.com/v1). v0.93 retyped the six scrape-limit fields
      on ServiceMonitorSpec/PodMonitorSpec (SampleLimit, TargetLimit, LabelLimit,
      LabelNameLengthLimit, LabelValueLengthLimit, KeepDroppedTargets) from *uint64 to
      *int64; kure imports only SampleLimit, so its public SampleLimit config field and
      SetServiceMonitorSampleLimit/SetPodMonitorSampleLimit signatures moved to int64 in
      lockstep. Wire format (monitoring.coreos.com/v1 JSON) is unchanged, so generated
      YAML still applies to clusters across this range.
  external-secrets:
    go_module: "github.com/external-secrets/external-secrets/apis"
    upstream_repo: "external-secrets/external-secrets"
    upstream_release: "v2.10.0"
    upstream_release_commit: "279f56c84d5d4058c3bfdeeaf5b1c2febb8851c0"
    supported_range: "2.9 - 2.10"
    notes: |
      Module path changed from root to /apis submodule in v1.0 (#5494).
      No semver tags for apis submodule — go.mod pins a pseudo-version, so
      upstream_release + upstream_release_commit above pin it to a named release
      instead of tracking main HEAD. sync-versions.sh substitutes upstream_release
      for the range check and asserts the pseudo-version's embedded 12-char digest
      prefixes upstream_release_commit, so the pin can no longer drift off the
      declared release; it also best-effort verifies upstream_release_commit
      against upstream_repo@upstream_release live (network permitting) to catch
      a hand-edited upstream_release that skipped scripts/sync-eso-pin.sh.
      Re-pin with scripts/sync-eso-pin.sh.
      v2.9.0 changed SecretStoreSpec.RefreshInterval from int to
      *intstr.IntOrString — a breaking change in kure's own public
      SetSecretStoreSpec/SetClusterSecretStoreSpec signatures (both take
      esv1.SecretStoreSpec by value). Kure is pre-1.0 (v0.2.0-beta) and does
      not populate that field itself, so this repo's own build is unaffected;
      external consumers constructing SecretStoreSpec{RefreshInterval: <int>}
      will fail to compile against this bump.
      v2.10.0 adds providers/features only (no further apis type changes per
      the upstream changelog); build + tests pass unchanged.
  cnpg:
    go_module: "github.com/cloudnative-pg/cloudnative-pg"
    supported_range: "1.24 - 1.30"
    notes: |
      CloudNativePG operator for PostgreSQL on Kubernetes.
      Cluster CR (with managed roles), Database CR (postgresql.cnpg.io/v1),
      ObjectStore CR (barmancloud.cnpg.io/v1), and ScheduledBackups.
      ObjectStore lives in a separate module (plugin-barman-cloud, entry
      cnpg-barman-cloud-plugin below), which in turn requires its own
      separate barman-cloud module (entry barman-cloud above) for the
      underlying object-store API types — two distinct CNPG modules, not one.
      v1.30 is a routine minor with no changes to the imported postgresql.cnpg.io/v1
      types (Cluster, Database, Pooler, ScheduledBackup) — build + tests pass unchanged.
    related_packages:
      - "github.com/cloudnative-pg/plugin-barman-cloud"
      - "github.com/cloudnative-pg/barman-cloud"
      - "github.com/cloudnative-pg/machinery"
  cnpg-barman-cloud-plugin:
    go_module: "github.com/cloudnative-pg/plugin-barman-cloud"
    supported_range: "0.9 - 0.14"
    notes: |
      Barman Cloud plugin for CNPG — provides ObjectStore CR (barmancloud.cnpg.io/v1).
      Versioned independently from the CNPG operator. Not to be confused with
      the barman-cloud entry above, a separate module this plugin itself
      depends on for object-store API types.
      v0.14 is a routine minor with no changes to the imported ObjectStore v1 type
      (build + tests pass unchanged).
  controller-runtime:
    go_module: "sigs.k8s.io/controller-runtime"
    supported_range: "0.22 - 0.24"
    notes: "v0.24.1 fixes Apply typed error handling regression; requires k8s.io/* v0.36.0 (Kubernetes 1.36)"
    related_packages:
      - "sigs.k8s.io/kustomize/api"
      - "sigs.k8s.io/yaml"
  gateway-api:
    go_module: "sigs.k8s.io/gateway-api"
    supported_range: "1.0 - 1.6"
    notes: |
      Gateway API v1 types (HTTPRoute). Used by pkg/kubernetes HTTPRoute builders.
      Kure generates gateway.networking.k8s.io/v1 resources (GA since v1.0).
      v1.6 is a routine minor with no changes to the imported
      gateway.networking.k8s.io/v1 HTTPRoute type — build + tests pass unchanged.
  kubernetes:
    go_module: "k8s.io/api"
    # k8s.io/* modules are versioned v0.N.x; the range below is in cluster terms (1.N).
    version_basis: kubernetes
    # What K8s cluster versions kure-generated YAML works with
    supported_range: "1.33 - 1.37"
    notes: |
      Go 1.26 baseline; generated YAML uses stable APIs compatible across this range.
      v1.37 added corev1.VolumeMount.BindMountOptions ([]string), making VolumeMount
      no longer comparable with ==/!=; kure's own code never compares VolumeMount
      values (only pkg/kubernetes/container_test.go did, fixed to use
      reflect.DeepEqual). Build + tests otherwise pass unchanged.
      VolumeMount is also kure's own public API (AddContainerVolumeMount takes one
      by value): external consumers that compare VolumeMount values or use them as
      map keys will fail to compile against this bump, the same class of break as
      external-secrets' SecretStoreSpec.RefreshInterval above. Kure is pre-1.0
      (v0.2.0-beta) and does not do either itself.
    related_packages:
      - "k8s.io/apimachinery"
      - "k8s.io/apiextensions-apiserver"
      - "k8s.io/client-go"
      - "k8s.io/cli-runtime"
