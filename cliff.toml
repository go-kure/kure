# git-cliff configuration for Kure
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
# Scrub downstream platform references that leak in from historical commit
# subjects so generated changelogs remain suitable for the upstream project.
# Ordered specific to catch-all to preserve useful context where possible.
postprocessors = [
    # allow-term:wharf — this pattern's source text names the term it scrubs from
    # generated changelogs (go-kure/.github check-forbidden-terms.sh).
    { pattern = '(?i)wharf\.zone/component', replace = "the platform component label" },
    # allow-term:wharf — ditto.
    { pattern = '(?i)wharf\.zone', replace = "the platform domain" },
    # allow-term:crane — ditto.
    { pattern = '(?i)\bfrom crane\b', replace = "from the downstream operator" },
    # allow-term:crane — ditto.
    { pattern = '(?i)\bwith crane\b', replace = "with the downstream operator" },
    # allow-term:wharf allow-term:crane allow-term:barge allow-term:harbor allow-term:rudder (catch-all scrub, every downstream term)
    { pattern = '(?i)\b(wharf|crane|barge|harbor|rudder)\b', replace = "the downstream operator" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    # Skip release-bot and version-bump commits — internal release machinery.
    { message = "^release", skip = true },
    { message = "^chore: bump version", skip = true },
    { message = "^chore: start next cycle", skip = true },
    # Group remaining chore commits so releases with only chore changes still
    # produce a CHANGELOG section (required by release validation).
    { message = "^chore", group = "Maintenance" },
    # Catch unconventional commits and skip them (case-insensitive)
    { message = "(?i)^wip", skip = true },
    { message = "(?i)^demo", skip = true },
    { message = "(?i)^deps", group = "Dependencies" },
    { message = "(?i)^internal", skip = true },
    { message = "(?i)^launcher", skip = true },
    { message = "(?i)^resolve", skip = true },
    { message = "(?i)^security", group = "Fixed" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
